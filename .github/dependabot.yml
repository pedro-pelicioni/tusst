version: 2

# Every ecosystem groups its minor+patch updates into a single PR. Ungrouped,
# this repo produced ~13 PRs a week — more than anyone merges, so most were
# closed unmerged and the branches piled up. Majors deliberately stay OUT of
# the groups: they arrive as individual PRs so each can be reviewed, and
# reverted, on its own.
#
# Grouped minor/patch PRs auto-merge once CI is green — see
# .github/workflows/dependabot-auto-merge.yml. CODEOWNERS still holds: anything
# touching runner/, runner-soroban/ or .github/workflows/ waits for a human.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # eslint-config-next still bundles an eslint-plugin-react that calls
      # context.getFilename(), removed in ESLint 10 — `npm run lint` dies with
      # "Error while loading rule 'react/display-name'" before linting a single
      # file. Not our bug and not fixable here; the bump can only land once
      # eslint-config-next supports v10, so drop this entry then rather than
      # letting the same red PR reappear every week.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

      # @types/node's major tracks the Node runtime, and ours is 22 everywhere
      # — ci.yml, deploy.yml and every dev machine. A newer major is not an
      # upgrade here, it's a mismatch: it types the project against APIs the
      # runtime doesn't have, and tsc goes green anyway (verified on 26.1.2),
      # so nothing fails until runtime. It moves when the Node version in the
      # workflows moves, not before — PR #55 proposed 22 -> 26 and was closed.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Workspace with two members (tusst-runner, tusst-syntest) — one entry
  # covers both, Dependabot resolves against the workspace Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/runner"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      cargo-runner-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # No Cargo.lock committed here on purpose (it's generated fresh inside the
  # Docker build — see runner-soroban/Dockerfile). Dependabot still resolves
  # against the pinned versions in Cargo.toml, just with weaker precision
  # than /runner. See SECURITY.md / runner-soroban/Dockerfile for the pins
  # this directory carries (ed25519-dalek, etc).
  - package-ecosystem: "cargo"
    directory: "/runner-soroban/warm"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      soroban-warm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # These exact pins exist to keep the OpenZeppelin Stellar suite linkable
      # — see the comment block at the top of runner-soroban/warm/Cargo.toml.
      # Bumping soroban-sdk without the OZ crates following mixes two sdk lines
      # in one contract and fails to link (duplicate panic handler), so a major
      # bump here is never independently mergeable. This set moves manually,
      # together, when OZ moves. Dependabot proposed exactly that in PR #31
      # (=26.1.0 -> =27.0.2) and CI had no way to catch it.
      - dependency-name: "soroban-sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stellar-*"
        update-types: ["version-update:semver-major"]

  # Keeps the SHA-pinned actions in ci.yml/deploy.yml/rust.yml from going stale
  # forever — pinning by SHA means nothing else would ever surface that a newer
  # release exists. One grouped PR, since they're reviewed together anyway.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
