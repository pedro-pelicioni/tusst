name: Dependabot auto-merge

# Approves and enables auto-merge on Dependabot patch/minor updates, so they
# land on their own once the required checks go green. Majors are left alone —
# they arrive as individual PRs (see .github/dependabot.yml) and get read.
#
# SECURITY — why pull_request_target is safe here:
# This workflow needs write scope, which `pull_request` doesn't grant on a
# Dependabot PR. `pull_request_target` grants it, but runs in the base-repo
# context, so the usual rule applies: it must NEVER check out or execute PR
# content. There is deliberately no actions/checkout step below — the job only
# reads PR metadata and calls the API. The write token never meets untrusted
# code. Same reasoning as the ci.yml / deploy.yml split.
#
# SCOPE — what this can actually merge:
# CODEOWNERS still gates prisma/, runner/, runner-soroban/, .github/workflows/,
# deploy/ and .mcp.json. A bot review does NOT satisfy require_code_owner_reviews,
# so PRs touching those paths keep waiting for a human — intentionally. In
# practice this auto-merges the npm updates (package.json / package-lock.json
# only, outside every owned path), which is the bulk of the volume.
#
# Requires "Allow GitHub Actions to create and approve pull requests" to be on
# (repo Settings -> Actions -> General). Without it the approve step 403s and
# every PR waits forever.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # On a grouped PR, update-type is the HIGHEST semver change in the group,
      # so a group containing a major is held back as a whole. That's what we
      # want: the group is merged or reviewed atomically.
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
