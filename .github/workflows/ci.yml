name: CI

# Validates PRs (including from forks). Deliberately carries NO secrets and
# never touches the VPS or Neon — see deploy.yml for that. This split keeps
# "workflow that accepts fork content" and "workflow that holds production
# credentials" physically separate.
#
# `pull_request` only, on purpose: branch protection means nothing reaches main
# without a PR, so a `push` trigger just ran every branch twice (the concurrency
# group can't dedupe them — push is refs/heads/x, PR is refs/pull/N/merge).

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # prisma generate only reads schema.prisma — never connects. A dummy
      # value keeps it from erroring on a missing DATABASE_URL.
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      # Dependabot regenerates package-lock.json with npm 11, which prunes the
      # `optional: true, peer: true` entries (typescript@4.9.5 under
      # stellar-wallets-kit, utf-8-validate@5.0.10 under walletconnect). Node 22
      # ships npm 10, whose `npm ci` rejects that lockfile as out of sync
      # ("Missing: typescript@4.9.5 from lock file") — which is what made every
      # npm Dependabot PR red. Pinning the major makes both sides agree.
      - run: npm install -g npm@11

      - run: npm ci --no-audit --no-fund

      # Runs before lint/build (and needs no node_modules) so a Dependabot bump
      # to runner-soroban/warm that leaves the IDE template behind fails fast
      # instead of auto-merging green and breaking Forge in production.
      - run: npm run check:forge-pins

      - run: npm run lint
      - run: npm run build
